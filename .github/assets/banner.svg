<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="HRMS Client — people, payroll and permissions in one place">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a3d">
        <animate attributeName="stop-color" values="#071a3d;#0a1f47;#06223a;#071a3d" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0a1f47">
        <animate attributeName="stop-color" values="#0a1f47;#1b3c6d;#0a1f47" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b3b4a">
        <animate attributeName="stop-color" values="#0b3b4a;#0f766e;#0b3b4a" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a7f3d0">
        <animate attributeName="offset" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#416fb5"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="22"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: "Segoe UI", Inter, -apple-system, Helvetica, Arial, sans-serif; }
    .rise { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .65s; } .d4 { animation-delay: .9s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .orb1 { animation: drift1 14s ease-in-out infinite; }
    .orb2 { animation: drift2 18s ease-in-out infinite; }
    .orb3 { animation: drift1 22s ease-in-out infinite reverse; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,30px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-25px); } }

    .tag { opacity: 0; animation: cycle 9s infinite; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .t1 { opacity: 1; }
    }
    .t2 { animation-delay: 3s; } .t3 { animation-delay: 6s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      5%, 28% { opacity: 1; transform: translateY(0); }
      33%, 100% { opacity: 0; transform: translateY(-8px); }
    }

    .card { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 3.6s cubic-bezier(.3,.9,.3,1) infinite; }
    .g1 { animation-delay: .0s; } .g2 { animation-delay: .12s; } .g3 { animation-delay: .24s; }
    .g4 { animation-delay: .36s; } .g5 { animation-delay: .48s; } .g6 { animation-delay: .60s; }
    @keyframes grow { 0% { transform: scaleY(0.15); } 35%, 80% { transform: scaleY(1); } 100% { transform: scaleY(0.15); } }

    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.6); opacity: 0; } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="orb1" cx="180" cy="60" r="120" fill="#0f766e" opacity="0.55" filter="url(#blur)"/>
    <circle class="orb2" cx="980" cy="290" r="140" fill="#416fb5" opacity="0.5" filter="url(#blur)"/>
    <circle class="orb3" cx="620" cy="-20" r="90" fill="#34d399" opacity="0.25" filter="url(#blur)"/>

    <!-- Left: copy -->
    <g class="rise d1">
      <rect x="70" y="72" width="176" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="90" cy="87" r="5" fill="#34d399"/>
      <circle class="pulse" cx="90" cy="87" r="5" fill="#34d399"/>
      <text x="104" y="92" font-size="13" font-weight="600" fill="#d1fae5" letter-spacing="1.5">ANGULAR 17 · HR</text>
    </g>

    <text class="rise d2" x="68" y="170" font-size="72" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2">HRMS Client</text>

    <g class="rise d3">
      <text x="72" y="212" font-size="22" fill="#cbd5e1">One workspace for</text>
      <g transform="translate(270 0)">
        <text class="tag t1" x="0" y="212" font-size="22" font-weight="700" fill="#6ee7b7">people &amp; departments.</text>
        <text class="tag t2" x="0" y="212" font-size="22" font-weight="700" fill="#93c5fd">salary &amp; payroll.</text>
        <text class="tag t3" x="0" y="212" font-size="22" font-weight="700" fill="#fcd34d">roles &amp; permissions.</text>
      </g>
    </g>

    <g class="rise d4">
      <text x="72" y="262" font-size="15" fill="#94a3b8">
        <tspan fill="#6ee7b7">$</tspan> npm start<tspan class="cursor" fill="#e2e8f0"> ▍</tspan>
      </text>
      <text x="72" y="288" font-size="13" fill="#64748b">→ http://localhost:4200</text>
    </g>

    <!-- Right: floating dashboard mock -->
    <g class="card">
      <g filter="url(#shadow)">
        <rect x="720" y="56" width="410" height="232" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      </g>
      <!-- window chrome -->
      <circle cx="744" cy="80" r="5" fill="#f87171"/>
      <circle cx="762" cy="80" r="5" fill="#fbbf24"/>
      <circle cx="780" cy="80" r="5" fill="#34d399"/>
      <rect x="806" y="74" width="140" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>

      <!-- sidebar -->
      <rect x="740" y="102" width="86" height="168" rx="10" fill="#071a3d" fill-opacity="0.55"/>
      <rect x="752" y="116" width="62" height="10" rx="5" fill="#34d399" fill-opacity="0.85"/>
      <rect x="752" y="138" width="50" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="752" y="156" width="58" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="752" y="174" width="44" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="752" y="192" width="54" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="752" y="210" width="40" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>

      <!-- stat tiles -->
      <g>
        <rect x="840" y="102" width="88" height="52" rx="10" fill="#ffffff" fill-opacity="0.09"/>
        <text x="852" y="122" font-size="10" fill="#94a3b8">Employees</text>
        <text x="852" y="143" font-size="18" font-weight="700" fill="#ffffff">248</text>
        <rect x="938" y="102" width="88" height="52" rx="10" fill="#ffffff" fill-opacity="0.09"/>
        <text x="950" y="122" font-size="10" fill="#94a3b8">Payroll</text>
        <text x="950" y="143" font-size="18" font-weight="700" fill="#6ee7b7">$1.2M</text>
        <rect x="1036" y="102" width="78" height="52" rx="10" fill="#ffffff" fill-opacity="0.09"/>
        <text x="1048" y="122" font-size="10" fill="#94a3b8">Depts</text>
        <text x="1048" y="143" font-size="18" font-weight="700" fill="#93c5fd">12</text>
      </g>

      <!-- chart -->
      <rect x="840" y="164" width="274" height="106" rx="10" fill="#ffffff" fill-opacity="0.06"/>
      <line x1="852" y1="256" x2="1102" y2="256" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect class="grow g1" x="862"  y="216" width="22" height="40" rx="5" fill="url(#bar)"/>
      <rect class="grow g2" x="900"  y="196" width="22" height="60" rx="5" fill="url(#bar2)"/>
      <rect class="grow g3" x="938"  y="206" width="22" height="50" rx="5" fill="url(#bar)"/>
      <rect class="grow g4" x="976"  y="180" width="22" height="76" rx="5" fill="url(#bar2)"/>
      <rect class="grow g5" x="1014" y="190" width="22" height="66" rx="5" fill="url(#bar)"/>
      <rect class="grow g6" x="1052" y="176" width="22" height="80" rx="5" fill="url(#bar2)"/>
    </g>
  </g>
</svg>
