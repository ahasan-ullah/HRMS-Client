<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Request flow: feature page, core service, auth interceptor, api-case interceptor, dev proxy, HRMS API">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a3d"/>
      <stop offset="100%" stop-color="#0a1f47"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <style>
    text { font-family: "Segoe UI", Inter, -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .lane { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .node { fill: #10264f; stroke: #ffffff; stroke-opacity: 0.16; }
    .api { fill: #0d3a4a; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .hl { opacity: 0; animation: hl 6s infinite; }
    .h2 { animation-delay: .5s; } .h3 { animation-delay: 1s; } .h4 { animation-delay: 1.5s; }
    .h5 { animation-delay: 2s; } .h6 { animation-delay: 2.5s; }
    @keyframes hl { 0% { opacity: 0; } 6%, 14% { opacity: 1; } 26%, 100% { opacity: 0; } }
  </style>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#dots)"/>

  <text class="lane" x="40" y="46" fill="#93c5fd">REQUEST →</text>
  <text class="lane" x="1160" y="268" fill="#6ee7b7" text-anchor="end">← RESPONSE</text>

  <!-- lanes -->
  <path id="out" d="M120 78 H1080" fill="none" stroke="#93c5fd" stroke-opacity="0.55" stroke-width="2" class="flow"/>
  <path id="in" d="M1080 222 H120" fill="none" stroke="#6ee7b7" stroke-opacity="0.55" stroke-width="2" class="flow"/>
  <g stroke-width="2">
    <g stroke="#93c5fd" stroke-opacity="0.35">
      <line x1="120" y1="78" x2="120" y2="100"/><line x1="312" y1="78" x2="312" y2="100"/>
      <line x1="504" y1="78" x2="504" y2="100"/><line x1="696" y1="78" x2="696" y2="100"/>
      <line x1="888" y1="78" x2="888" y2="100"/><line x1="1080" y1="78" x2="1080" y2="100"/>
    </g>
    <g stroke="#6ee7b7" stroke-opacity="0.35">
      <line x1="120" y1="200" x2="120" y2="222"/><line x1="312" y1="200" x2="312" y2="222"/>
      <line x1="504" y1="200" x2="504" y2="222"/><line x1="696" y1="200" x2="696" y2="222"/>
      <line x1="888" y1="200" x2="888" y2="222"/><line x1="1080" y1="200" x2="1080" y2="222"/>
    </g>
  </g>

  <!-- packets -->
  <circle r="6" fill="#93c5fd" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite"><mpath href="#out"/></animateMotion>
  </circle>
  <circle r="6" fill="#6ee7b7" filter="url(#glow)">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#in"/></animateMotion>
  </circle>

  <!-- nodes -->
  <rect class="node" x="40" y="100" width="160" height="100" rx="16"/>
  <rect class="hl" x="40" y="100" width="160" height="100" rx="16" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <text class="title" x="120" y="146" text-anchor="middle">Feature page</text>
  <text class="sub" x="120" y="170" text-anchor="middle">lazy-loaded route</text>

  <rect class="node" x="232" y="100" width="160" height="100" rx="16"/>
  <rect class="hl h2" x="232" y="100" width="160" height="100" rx="16" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <text class="title" x="312" y="146" text-anchor="middle">Core service</text>
  <text class="sub" x="312" y="170" text-anchor="middle">HttpClient · RxJS</text>

  <rect class="node" x="424" y="100" width="160" height="100" rx="16"/>
  <rect class="hl h3" x="424" y="100" width="160" height="100" rx="16" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <text class="title" x="504" y="146" text-anchor="middle">authInterceptor</text>
  <text class="sub" x="504" y="170" text-anchor="middle">Bearer · 401 → refresh</text>

  <rect class="node" x="616" y="100" width="160" height="100" rx="16"/>
  <rect class="hl h4" x="616" y="100" width="160" height="100" rx="16" fill="none" stroke="#6ee7b7" stroke-width="2"/>
  <text class="title" x="696" y="146" text-anchor="middle">apiCaseInterceptor</text>
  <text class="sub" x="696" y="170" text-anchor="middle">PascalCase → camelCase</text>

  <rect class="node" x="808" y="100" width="160" height="100" rx="16"/>
  <rect class="hl h5" x="808" y="100" width="160" height="100" rx="16" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <text class="title" x="888" y="146" text-anchor="middle">Dev proxy</text>
  <text class="sub" x="888" y="170" text-anchor="middle">/api · proxy.conf.json</text>

  <rect class="node api" x="1000" y="100" width="160" height="100" rx="16"/>
  <rect class="hl h6" x="1000" y="100" width="160" height="100" rx="16" fill="none" stroke="#6ee7b7" stroke-width="2"/>
  <text class="title" x="1080" y="146" text-anchor="middle">HRMS API</text>
  <text class="sub" x="1080" y="170" text-anchor="middle">localhost:44368</text>
</svg>
